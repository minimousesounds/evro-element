# Сборка и выкладка сайта на GitHub Pages при каждом изменении в main.
# С 05.11.2026 это запасной боевой хостинг kama-filtr.ru на время аварии Beget: собирается как боевой сайт,
# с файлом CNAME. Когда Beget восстановится, домен вернём туда, а здесь снова будет закрытая копия
# (SITE_URL https://minimousesounds.github.io, SITE_BASE /evro-element/, PUBLIC_PREVIEW 1, без CNAME).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://kama-filtr.ru
      - name: Домен и лишние для Pages файлы
        # PHP и правила Apache на Pages не работают, не отдаём их как текст
        run: |
          echo kama-filtr.ru > dist/CNAME
          rm -f dist/send.php dist/main.htaccess dist/old-domain.htaccess
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
