# Боевой сайт https://kama-filtr.ru: сборка и выкладка на хостинг Beget при каждом изменении в main.
# Нужны секреты репозитория BEGET_FTP_HOST, BEGET_FTP_USER, BEGET_FTP_PASSWORD
# и переменная BEGET_DIR — папка сайта относительно FTP-аккаунта (./, если аккаунт уже смотрит в public_html).
# Пока секретов нет, сборка проходит, а выкладка пропускается.
name: Deploy kama-filtr.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# выкладки идут по очереди и не обрываются: недолитый сайт хуже, чем чуть устаревший
concurrency:
  group: beget
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://kama-filtr.ru
      - id: cfg
        name: Есть ли доступ к хостингу
        run: echo "ready=${{ secrets.BEGET_FTP_PASSWORD != '' && vars.BEGET_DIR != '' }}" >> "$GITHUB_OUTPUT"
      - name: Выкладка на Beget
        if: steps.cfg.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.BEGET_FTP_HOST }}
          USER: ${{ secrets.BEGET_FTP_USER }}
          PASS: ${{ secrets.BEGET_FTP_PASSWORD }}
          DIR: ${{ vars.BEGET_DIR }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          # правила старого домена новому сайту не нужны
          rm -f dist/old-domain.htaccess
          # Beget пускает только по FTPS и сам выставляет права файлам (SITE CHMOD запрещён, отсюда --no-perms);
          # --delete убирает со старой выкладки то, чего больше нет
          lftp -c "set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 3;
            open -u \"$USER\",\"$PASS\" \"$HOST\";
            mirror --reverse --delete --no-perms --parallel=8 --verbose=1 dist/ \"$DIR\""
